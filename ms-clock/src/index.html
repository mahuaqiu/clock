<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毫秒时钟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #clock {
            font-family: 'Courier New', 'Consolas', monospace;
            color: #000000;
            white-space: nowrap;
            letter-spacing: 0;
            text-shadow: none;
            cursor: default;
        }
        /* 关闭按钮 - 右上角，始终显示 */
        #close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border: none;
            background: rgba(0, 0, 0, 0.08);
            color: #666;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            z-index: 10;
        }
        #close-btn:hover {
            background: rgba(255, 0, 0, 0.15);
            color: #ff0000;
        }
        /* 顶部文字 label */
        #label {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Courier New', 'Consolas', monospace;
            color: #000000;
            text-align: center;
            white-space: nowrap;
            cursor: default;
            display: none;
        }
    </style>
</head>
<body>
    <div id="label" data-tauri-drag-region></div>
    <div id="clock" data-tauri-drag-region></div>
    <button id="close-btn" title="退出">✕</button>
    <script>
        const clockEl = document.getElementById('clock');
        const closeBtn = document.getElementById('close-btn');
        const labelEl = document.getElementById('label');

        // 监听 Tauri 事件接收 setup-args
        if (window.__TAURI__) {
            window.__TAURI__.event.listen('setup-args', function(event) {
                const payload = event.payload;
                if (payload.text) {
                    labelEl.textContent = payload.text;
                    labelEl.style.display = 'block';
                    // 触发重新计算字体大小
                    clockEl.style.fontSize = calcFontSize() + 'px';
                    labelEl.style.fontSize = (calcFontSize() * 0.6) + 'px';
                }
            });
        }

        // 退出程序
        closeBtn.addEventListener('click', () => {
            // Tauri 2 调用方式
            if (window.__TAURI__) {
                window.__TAURI__.core.invoke('quit_app').catch(function(e) {
                    console.error('invoke quit_app 失败:', e);
                    // 备用：尝试关闭窗口
                    if (window.__TAURI__.window) {
                        window.__TAURI__.window.getCurrent().close();
                    }
                });
            } else {
                // 非 Tauri 环境
                window.close();
            }
        });

        // 根据窗口尺寸动态计算字体大小
        function calcFontSize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            let labelHeight = 0;

            // 如果 label 可见，计算其高度
            if (labelEl && labelEl.style.display !== 'none') {
                labelHeight = labelEl.offsetHeight + 20; // 20px margin
            }

            const byWidth = w / (12 * 0.62);
            const byHeight = (h - labelHeight) * 0.8;
            return Math.floor(Math.min(byWidth, byHeight));
        }

        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            clockEl.textContent = h + ':' + m + ':' + s + '.' + ms;
            clockEl.style.fontSize = calcFontSize() + 'px';

            // 更新 label 字体大小（60% 时钟字体大小）
            if (labelEl && labelEl.textContent) {
                labelEl.style.fontSize = (calcFontSize() * 0.6) + 'px';
            }

            requestAnimationFrame(tick);
        }

        tick();
    </script>
</body>
</html>

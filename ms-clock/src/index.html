<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毫秒时钟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: transparent;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #clock {
            font-family: 'Courier New', 'Consolas', monospace;
            color: #00ff88;
            white-space: nowrap;
            letter-spacing: 0;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 255, 136, 0.2);
            /* 整个时钟区域可拖拽窗口 */
            cursor: default;
        }
    </style>
</head>
<body>
    <div id="clock" data-tauri-drag-region></div>
    <script>
        const clockEl = document.getElementById('clock');

        // 根据窗口尺寸动态计算字体大小
        function calcFontSize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            // HH:MM:SS.mmm 共12字符，等宽字体宽度约0.6倍字号
            const byWidth = w / (12 * 0.62);
            const byHeight = h * 0.8;
            return Math.floor(Math.min(byWidth, byHeight));
        }

        function tick() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            clockEl.textContent = h + ':' + m + ':' + s + '.' + ms;
            clockEl.style.fontSize = calcFontSize() + 'px';
            requestAnimationFrame(tick);
        }

        tick();
    </script>
</body>
</html>
